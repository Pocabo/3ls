         packLoaded:'Language pack "{n}" loaded! (saved in this browser)',
         packFail:'Could not read the language pack: {e} — check the schema in languages/_template.js.' },
  };
  function T(k){ const b=curBase(); return (I18N[b]&&I18N[b][k]!=null)?I18N[b][k]:(I18N.ko[k]||k); }
  // 자리표시자 치환: TF('quizIntro',{c:10,s:80}) → "10문항 · 80점 이상이면…"
  function TF(k, vars){ let s=T(k); for(const a in (vars||{})) s=s.split('{'+a+'}').join(vars[a]); return s; }

  /* ── 유틸 ───────────────────────────────────────── */
  const $ = sel => document.querySelector(sel);
  const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const jattr = s => esc(String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")); // onclick 속 JS 문자열 안전 이스케이프
  function norm(s){ // 답안 비교용 정규화: 소문자, 공백 축약, 끝 문장부호 제거, 유니코드 NFC
    return String(s??'').normalize('NFC').toLowerCase().replace(/[.!?…]+\s*$/,'').replace(/\s+/g,' ').replace(/[’]/g,"'").trim();
  }
  /* 채점용 정규화. 팩이 ignoreDiacritics:true 면 발음 구별 부호를 지우고 비교한다.
     라틴어 마크론(amāre/amare)처럼 교재용 보조 기호는 무시해야 하고,
     프랑스어 악센트(café)처럼 철자의 일부인 언어는 기본값(구분)을 그대로 둔다. */
  /* 발음용 표기: 팩이 단어에 say(예문은 exSay)를 주면 화면 표기 대신 그것을 읽는다.
     라틴어 고전식 발음(Caesar→Kaisar)을 스페인어 음성으로 근사하거나,
     한자 표제어를 한국어 음(山→산)으로 읽히는 데 쓴다. */
  const sayOf   = w => (w && w.say)   || (w && w.w)  || '';
  const sayExOf = w => (w && w.exSay) || (w && w.ex) || '';

  function normAns(s){
    const t = norm(s);
    return (pack()||{}).ignoreDiacritics
      ? t.normalize('NFD').replace(/[̀-ͯ]/g,'').normalize('NFC')
      : t;
  }
  // 정답이 여러 개일 수 있는 문제(어순이 자유로운 언어 등): answers 배열을 함께 받는다
  function answerList(ex){ return [ex.answer].concat(ex.answers||[]).filter(x=>x!=null); }
  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
  function speak(text, tts){
    const lang = tts || (pack() && pack().tts);
    if(!lang) return; // tts 미지정 팩(인공어·악보 등)은 발음 기능 없음 — 조용히 무시
    if(!('speechSynthesis' in window)) return alert(T('noTTS'));
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    const v = speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').startsWith(lang.split('-')[0]));
    if(v) u.voice = v;
    u.rate = .92;
    speechSynthesis.speak(u);
  }
  if('speechSynthesis' in window) speechSynthesis.getVoices(); // 보이스 목록 예열

  function allWords(){ return pack().levels.flatMap(L=>(L.words||[]).map(w=>({...w, level:L.level}))); }
  function genderTag(g){
    if(g==='m') return '<span class="gender m">m</span>';
    if(g==='f') return '<span class="gender f">f</span>';
    if(g==='mf') return '<span class="gender mf">m/f</span>';
    return '';
  }

  /* ── SRS(누적 복습 루프) ──────────────────────────
     키는 팩 안에서 고유해야 한다. 표제어만 쓰면 같은 철자가 여러 레벨/분류에 있을 때
     (동형이의어, 여러 사전에 겹쳐 실린 단어) 진도가 서로 덮어써진다.
     → 'L{레벨}|{표제어}' 로 분리하고, 팩이 w.id 를 주면 그것을 우선한다.
     기존 저장값(표제어만인 옛 키)도 계속 읽어 진도가 리셋되지 않게 한다. */
  function srsKey(w){ return w.id || ('L'+(w.level??'?')+'|'+w.w); }
  function srsGet(st, w){ return st.srs[srsKey(w)] || st.srs[w.w] || null; }
  function srsMark(word, known){
    const st = langState();
    const key = typeof word==='string' ? word : srsKey(word);
    const prev = typeof word==='string' ? st.srs[word] : srsGet(st, word);
    const cur = prev ? {...prev} : {box:0, due:0};
    if(known){ cur.box = Math.min(cur.box+1, SRS_DAYS.length-1); }
    else{ cur.box = 0; }
    cur.due = Date.now() + SRS_DAYS[cur.box]*DAY;
    st.srs[key] = cur; save(); updateBadge();
  }
  function dueWords(){
    const st = langState(), now = Date.now();
    return allWords().filter(w=>{ const v = srsGet(st, w); return v && v.due<=now; });
  }
  function updateBadge(){
    const n = dueWords().length, b = $('#reviewBadge');
    b.style.display = n? 'inline-block':'none'; b.textContent = n;
  }

  /* ── 라우팅 ─────────────────────────────────────── */
  function go(name, arg){
    view = {name, arg}; quiz=null; flash=null; wbState=null; gsState=null;
    if(name!=='library') libState=null;
    rdDocIdx=null; rdQuery='';           // 다른 화면으로 나가면 읽기 상태는 저장된 것으로 되돌린다
    render(); window.scrollTo(0,0);
  }

  function render(){
    clearTimeout(rdTimer); clearTimeout(rdTapTimer);  // 화면을 다시 그리면 읽기 탭의 예약도 무효
    const el = $('#app');
    if(view.name==='picker'){ el.innerHTML = pickerView(); return; } // 언어 선택 화면은 활성 팩과 무관
    if(view.name==='search'){ el.innerHTML = searchView(); return; } // 통합검색도 활성 팩과 무관
    if(!pack()){ el.innerHTML = `<div class="empty">${T('noPack')}</div>`; return; }
    if(view.name==='home') el.innerHTML = homeView();
    else if(view.name==='level') el.innerHTML = levelView(view.arg);
    else if(view.name==='review') el.innerHTML = reviewView();
    else if(view.name==='wordbank') el.innerHTML = wordbankView();
    else if(view.name==='library') el.innerHTML = libraryView();
    Object.keys(window.__blocks||{}).forEach(paintBlocks); // 블록 문제 초기 페인트
    updateBadge();
  }

  /* ── 홈: 레벨 지도 ──────────────────────────────── */
  // 단계 라벨: 팩이 phaseLabels:{intro:'…',A:'…'} 로 직접 공급 가능(과정 성격에 맞게).
  // 없으면 기본 라벨을 base 언어로. 정의되지 않은 phase 값은 그대로 표시.
  function phaseLabel(p){
    if(!p) return '';
    const custom = (pack()||{}).phaseLabels;
    if(custom && custom[p]!=null) return custom[p];
    const def = {intro:T('phIntro'), A:T('phA'), B:T('phB'), C:T('phC')};
    return def[p] || String(p);
  }
  /* ── 언어 선택 화면 ────────────────────────────────
     제목 옆 Base(설명 언어) 드롭다운으로 KR/EN 전환. 아래엔 그 base의 target들을
     카드로 나열하고, 한 target에 확장 팩이 있으면 카드 ▾ 로 펼쳐 바로 들어간다. */
  function pickerView(){
    const b = curBase();
    const baseOpts = basesAvailable().map(x=>`<option value="${x}" ${x===b?'selected':''}>${BASE_LABEL[x]||x}</option>`).join('');
    const cards = targetsForBase(b).map(t=>{
      const ps = packsOfTarget(t), main = mainPackOf(t);
      const extras = ps.filter(p=>p!==main && packBases(p).has(b));   // 현재 base를 지원하는 확장만
      const words = ps.reduce((n,p)=>n+packWordCount(p.id, b),0);      // 현재 base에 뜻이 있는 단어만 집계
      const active = (LANGUAGE_PACKS[S.activeLang]||{}).target===t;
      const caret = extras.length
        ? `<button class="pick-caret" onclick="App.togglePick('${t}',event)" title="${esc(T('ttExtra'))}" aria-label="${esc(T('ttExtra'))}">▾</button>` : '';
      const sub = extras.length
        ? `<div class="pick-sub" id="picksub-${t}">${extras.map(k=>
            `<button class="pick-subitem" onclick="App.switchLang('${k.id}')">${k.id===S.activeLang?'● ':''}${k.flag||''} ${esc(k.menuLabel||k.name)}${k.dictionary?` <span class="pill gray">${T('dict')}</span>`:''}</button>`
          ).join('')}</div>` : '';
      return `<div class="levelcard pick-card ${active?'on':''}">
        <div class="pick-head" onclick="App.switchLang('${main.id}')">
          <div class="pick-flag">${TARGETS[t]?.flag||main.flag||'🌐'}</div>
          <div class="pick-body">
            <h3>${esc(targetName(t))}${active?` <span class="pill">${T('now')}</span>`:''}</h3>
            <div class="meta">${esc(main.nativeName||'')} · ${words} ${T('words')}${extras.length?` · +${extras.length}`:''}</div>
          </div>
          ${caret}
        </div>${sub}
      </div>`;
    }).join('');
    return `<div class="pick-title"><h1>🌐 Languages</h1>
        <span class="base-tag">${T('baseLabel')}</span>
        <select class="base-select" onchange="App.setBase(this.value)" title="${esc(T('baseLabel'))}">${baseOpts}</select>
      </div>
      <p class="sub" style="margin-bottom:18px">${T('pickHint')}</p>
      <div class="levelgrid">${cards}</div>`;
  }
  // picker 카드의 ▾: 재렌더 없이 그 target의 확장 목록만 펼침/접기 (카드 클릭 전파 차단)
  function togglePick(id, e){
    if(e) e.stopPropagation();
    const box = document.getElementById('picksub-'+id);
    if(box) box.classList.toggle('open');
  }
  // Base(설명 언어) 전환: UI 언어도 바뀜. 현재 팩이 새 base를 지원하면 유지, 아니면 첫 target으로.
  function setBase(b){
    if(!targetsForBase(b).length) return;
    S.base = b;
    const p = LANGUAGE_PACKS[S.activeLang];
    if(!p || !packBases(p).has(b)){
      const ts = targetsForBase(b);
      if(ts.length) S.activeLang = resolvePack(mainPackOf(ts[0]).id);
    }
    save(); applyI18n(); renderContentsMenu(); render();
  }

  function homeView(){
    const p = pack(), st = langState();
    const totalWords = allWords().length;
    const dict = !!p.dictionary; // 사전 전용 팩: 잠금·시험 없음
    const learned = Object.values(st.srs).filter(v=>v.box>=2).length;
    const enBase = curBase()==='en';
    let cards = p.levels.map(L=>{
      // Library: 레벨 잠금 없음 — 모든 레벨 자유 열람
      const best = st.quizBest[L.level];
      const doneMap = st.doneEx['L'+L.level]||{};
      const exDone = Object.keys(doneMap).length;
      const exTotal = (L.exercises||[]).length;
      const pct = exTotal? Math.round(exDone/exTotal*100) : 0;
      if(dict) return `<div class="levelcard" onclick="App.go('level',${L.level})">
        <span class="phase-tag">${(L.words||[]).length} ${T('words')}</span>
        <h3 style="margin-top:2px">${esc(L.title)}</h3>
        <div class="meta">${esc(L.sub || (enBase?'Tap to view words':'눌러서 단어 보기'))}</div>
      </div>`;
      const rdLines = readDocs(L).reduce((n,d)=>n+(d.lines||[]).length, 0);
      const meta = (L.words||[]).length
        ? `${T('words')} ${(L.words||[]).length} · ${T('exercises')} ${exTotal}${best!=null? ` · ${enBase?'best':'시험 최고'} <b>${best}%</b>`:''}`
        : TF('rdLines',{n: rdLines.toLocaleString()});
      return `<div class="levelcard" onclick="App.go('level',${L.level})">
        <span class="phase-tag">${esc(phaseLabel(L.phase))}</span>
        <div class="lv">LEVEL ${L.level}${L.cefr? ` · ${esc(L.cefr)}`:''}</div>
        <h3>${esc(L.title)}</h3>
        <div class="meta">${meta}</div>
        <div class="progressbar"><div style="width:${pct}%"></div></div>
      </div>`;
    }).join('');
    // 과정 소개는 팩의 desc가 우선. 없으면 레벨 수로 일반 문구 생성 (CEFR 등 특정 체계를 가정하지 않음)
    const courseDesc = esc(p.desc || (enBase? `${p.levels.length}-level course` : `레벨 ${p.levels.length}개 과정`));
    const totalRead = p.levels.reduce((n,L)=>n + readDocs(L).reduce((k,d)=>k+(d.lines||[]).length,0), 0);
    const sub = (!totalWords && totalRead)
      ? `${esc(p.desc||'')} · ${TF('rdLines',{n: totalRead.toLocaleString()})}`
      : dict
      ? `${esc(p.desc||'')} · <b>${totalWords}</b> ${T('words')} · ${enBase?'Tap a category to browse.':'분류를 눌러 단어를 살펴보세요.'}`
      : enBase
        ? `${courseDesc} · <b>${learned}</b>/${totalWords} ${T('words')} in review orbit · all levels open (Library) · tests are optional.`
        : `${courseDesc} · 단어 ${totalWords}개 중 <b>${learned}</b>개 암기 궤도 진입 · 모든 레벨 자유 열람(Library) · 시험은 선택 연습입니다.`;
    const title = enBase ? targetName(p.target) : (p.name || targetName(p.target));
    return `<h1>${p.flag||''} ${esc(title)} <span class="pill">${esc(p.nativeName||'')}</span></h1>
      <p class="sub" style="margin-bottom:18px">${sub}</p>
      <div class="levelgrid">${cards}</div>`;
  }

  /* ── 레벨 화면(탭: 단어/문법/연습/시험) ─────────── */
  function levelView(lv){
    const L = pack().levels.find(x=>x.level===lv);
    if(!L) return `<div class="empty">${T('noLevel')}</div>`;
    const dict = !!pack().dictionary;
    let tab = view.tab || 'words';
    // 사전 팩은 '단어' 탭만 제공 (시험·연습·암기카드 없음)
    const hasRead = readDocs(L).some(d=>(d.lines||[]).length);
    const hasWords = !!(L.words||[]).length;
    const tabDefs = (hasWords? [['words',T('tWords')]] : [])
      .concat((hasWords && !dict)? [['flash',T('tFlash')]] : [])
      .concat((L.grammar||[]).length? [['grammar',T('tGrammar')]] : [])
      .concat(hasRead? [['read',T('tRead')]] : [])
      .concat((!dict && ((L.exercises||[]).length || (L.quiz||[]).length))
        ? [['ex',T('tEx')],['quiz',T('tQuiz')]] : []);
    if(!tabDefs.length) tabDefs.push(['words',T('tWords')]);
    if(!tabDefs.some(([k])=>k===tab)) tab = tabDefs[0][0];
    view.tab = tab;   // 스크롤 추적이 '지금 읽기 탭인가'를 이 값으로 판단한다
    const tabs = tabDefs
      .map(([k,label])=>`<button class="${tab===k?'on':''}" onclick="App.tab('${k}')">${label}</button>`).join('');
    let body='';
    if(tab==='words') body = wordsTab(L);
    else if(tab==='flash') body = flashTab(L);
    else if(tab==='grammar') body = grammarTab(L);
    else if(tab==='read') body = readingTab(L);
    else if(tab==='ex') body = exTab(L);
    else if(tab==='quiz') body = quizTab(L);
    const cefrPill = L.cefr? ` <span class="pill">${esc(L.cefr)}</span>`:'';
    const phasePill = (!dict && phaseLabel(L.phase))? ` <span class="pill gray">${esc(phaseLabel(L.phase))}</span>`:'';
    const head = dict? `${esc(L.title)}` : `Level ${L.level} — ${esc(L.title)}`;
    return `<span class="backlink" onclick="App.go('home')">${dict?T('backList'):T('backMap')}</span>
      <h1>${head}${cefrPill}${phasePill}</h1>
      ${L.desc? `<p class="sub" style="margin-bottom:14px">${esc(L.desc)}</p>`:''}
      <div class="tabs">${tabs}</div>${body}`;
  }
  function tab(t){ view.tab=t; quiz=null; flash=null; render(); }

  /* ── 단어 표: 데이터에 존재하는 필드만 열로 렌더 ──────
     예) 한자어 팩처럼 ex/exKo가 모두 비어 있으면 "예문" 열 자체가 사라진다.
     새 언어팩이 어떤 필드를 채우든 표가 알아서 맞춰지므로 호환성이 높다. */
  const someFilled = (words, fn) => words.some(w => { const v = fn(w); return v!=null && String(v).trim()!==''; });

  function wordColumns(words, opts={}){
    const cols = [];
    const enBase = curBase()==='en';
    const p = pack() || {};
    // 열 이름 오버라이드: pack.columnLabels = { <열 key>: '새 이름' }
    const labels = p.columnLabels || {};
    const lbl = (key, def) => labels[key] != null ? labels[key] : def;
    // key: 접기 저장용 식별자 · collapsible: 사용자가 숨길 수 있는 열인지 (단어는 항상 표시)
    if(opts.cat) cols.push({ key:'cat', th:lbl('cat',T('thCat')), collapsible:true, thCls:'col-cat', tdCls:'w-ipa col-cat',
      td: w => esc(w.catTitle||'') });

    cols.push({ key:'word', th:lbl('word',T('thWord')), collapsible:false, thCls:'col-word', tdCls:'w-word col-word',
      td: w => `${esc(w.w)}${genderTag(w.gender)}${w.plural?`<div class="w-ipa">${enBase?'pl.':'복수:'} ${esc(w.plural)}</div>`:''}` });

    if(someFilled(words, w=>w.ipa)) cols.push({ key:'ipa', th:lbl('ipa',T('thIpa')), collapsible:true, thCls:'col-ipa', tdCls:'w-ipa col-ipa',
      td: w => esc(w.ipa||'') });

    // 뜻: 현재 base의 뜻만 표시. 반대편 base 뜻은 감춘다.
    if(someFilled(words, w=>meaningOf(w)) || someFilled(words, w=>tipOf(w)))
      cols.push({ key:'meaning', th:lbl('meaning',T('thMean')), collapsible:true, thCls:'', tdCls:'',
        td: w => `${esc(meaningOf(w))}${(tipOf(w) && !colHidden.has('tip'))?`<div class="hint">💡 ${esc(tipOf(w))}</div>`:''}` });

    if(someFilled(words, w=>w.ex)) cols.push({ key:'ex', th:lbl('ex',T('thEx')), collapsible:true, thCls:'', tdCls:'',
      td: w => w.ex ? `${esc(w.ex)}${exmOf(w)?`<div class="w-ipa">${esc(exmOf(w))}</div>`:''}` : '' });

    // tts 미지정 팩(악보·인공어 등)은 듣기 열 자체를 렌더하지 않는다
    if(p.tts) cols.push({ key:'speak', th:lbl('speak',T('thSpeak')), collapsible:true, thCls:'col-speak', tdCls:'col-speak',
      td: w => `<button class="speak" onclick="App.speak('${jattr(sayOf(w))}')" title="${esc(T('ttSpeakW'))}">🔊</button>`
        + (w.ex?`<button class="speak" onclick="App.speak('${jattr(sayExOf(w))}')" title="${esc(T('ttSpeakEx'))}">📢</button>`:'') });

    // 열 순서 재배치: pack.columnOrder = ['word','ipa',…]. 목록에 없는 열은 원래 순서로 뒤에 붙는다.
    if(Array.isArray(p.columnOrder)){
      const rank = k => { const i = p.columnOrder.indexOf(k); return i===-1 ? Infinity : i; };
      return cols.map((c,i)=>[c,i]).sort((a,b)=> (rank(a[0].key)-rank(b[0].key)) || (a[1]-b[1])).map(x=>x[0]);
    }
    return cols;
  }

  function wordTableHtml(words, opts={}){
    const allCols = wordColumns(words, opts);
    // 접기 대상: 숨길 수 있는(collapsible) 열 + 팁(뜻 열 안의 💡 줄만 별도로 숨김)
    const toggles = allCols.filter(c => c.collapsible).map(c => ({key:c.key, label:c.th}));
    if(someFilled(words, w=>tipOf(w))) toggles.push({key:'tip', label:T('tipCol')});
    // on = 표시 중, 클릭 시 토글
    const bar = toggles.length > 1 ? `<div class="col-toggle"><span class="col-toggle-label">${T('colFold')}</span>${
      toggles.map(t => `<button class="wb-chip ${colHidden.has(t.key)?'':'on'}" onclick="App.toggleCol('${t.key}')">${t.label}</button>`).join('')
    }</div>` : '';
    // 실제로 그릴 열 = collapsible이면서 숨김 처리된 것 제외
    const cols = allCols.filter(c => !(c.collapsible && colHidden.has(c.key)));
    const head = `<tr>${cols.map(c=>`<th${c.thCls?` class="${c.thCls}"`:''}>${c.th}</th>`).join('')}</tr>`;
    const rows = words.map(w=>`<tr>${cols.map(c=>`<td${c.tdCls?` class="${c.tdCls}"`:''}>${c.td(w)}</td>`).join('')}</tr>`).join('');
    // 열 수에 맞춰 최소 폭을 잡아, 열이 적은 팩은 모바일에서 불필요한 가로 스크롤이 안 생기게 함
    const minW = Math.max(300, cols.length * 100);
    return `${bar}<div class="table-wrap"><table class="wordtable" style="min-width:${minW}px">${head}${rows}</table></div>`;
  }
  function toggleCol(key){
    if(colHidden.has(key)) colHidden.delete(key); else colHidden.add(key);
    localStorage.setItem('3ls.colHidden', JSON.stringify([...colHidden]));
    render();
  }

  function wordsTab(L){
    return `<div class="card">${wordTableHtml(L.words||[])}</div>`;
  }

  /* ── 단어은행: 현재 언어팩의 모든 단어를 검색·필터 ─ */
  function wbFilteredWords(){
    const p = pack();
    const cat = wbState.cat;
    let words = p.levels.flatMap(L =>
      (cat==='all' || String(L.level)===String(cat)) ? (L.words||[]).map(w=>({...w, catTitle:L.title})) : []
    );
    const q = norm(wbState.q).trim();
    if(q) words = words.filter(w => {
      const hay = [w.w, w.ipa, w.ex].concat(w.m?Object.values(w.m):[]).concat(w.exm?Object.values(w.exm):[]);
      return hay.some(x => norm(x||'').includes(q));
    });
    return words;
  }
  function wbTableHtml(){
    const words = wbFilteredWords();
    if(!words.length) return `<div class="empty" style="padding:26px 0">${T('noResult')}</div>`;
    return wordTableHtml(words, {cat:true});
  }
  function wbCardsHtml(){
    const words = wbFilteredWords();
    if(!words.length) return `<div class="empty" style="padding:26px 0">${T('noResult')}</div>`;
    // 카드: 원어만 보이고, 누르면 발음·뜻·예문이 아래에 펼쳐짐
    return `<div class="wb-cards">` + words.map(w=>`
      <div class="wb-card" onclick="this.classList.toggle('open')">
        <div class="wb-card-front">
          <span class="wb-card-word">${esc(w.w)}${genderTag(w.gender)}</span>
          ${pack().tts? `<button class="speak" onclick="event.stopPropagation(); App.speak('${jattr(sayOf(w))}')" title="${esc(T('ttSpeakW'))}">🔊</button>`:''}
        </div>
        <div class="wb-card-back">
          ${w.ipa? `<div class="w-ipa">${esc(w.ipa)}</div>`:''}
          ${meaningOf(w)? `<div class="wb-card-ko">${esc(meaningOf(w))}</div>`:''}
          ${w.plural? `<div class="w-ipa">${curBase()==='en'?'pl.':'복수:'} ${esc(w.plural)}</div>`:''}
          ${w.ex? `<div class="wb-card-ex">${esc(w.ex)}${exmOf(w)?`<div class="w-ipa">${esc(exmOf(w))}</div>`:''}
            ${pack().tts? `<button class="speak" onclick="event.stopPropagation(); App.speak('${jattr(sayExOf(w))}')" title="${esc(T('ttSpeakEx'))}">📢</button>`:''}</div>`:''}
          ${tipOf(w)? `<div class="hint">💡 ${esc(tipOf(w))}</div>`:''}
        </div>
      </div>`).join('') + `</div>`;
  }
  function wbResultsHtml(){ return wbState.mode==='cards'? wbCardsHtml() : wbTableHtml(); }
  function wordbankView(){
    const p = pack();
    if(!wbState) wbState = {q:'', cat:'all', mode: localStorage.getItem('3ls.wbMode')||'table'};
    const total = allWords().length;
    const wbTitle = curBase()==='en' ? targetName(p.target) : (p.name || targetName(p.target));
    const chips = [{id:'all', label:T('wbAll')}, ...p.levels.map(L=>({id:L.level, label:L.title}))]
      .map(c=>`<button class="wb-chip ${String(wbState.cat)===String(c.id)?'on':''}" onclick="App.wbSetCat('${c.id}')">${esc(c.label)}</button>`)
      .join('');
    const m = wbState.mode;
    return `<h1>📚 ${esc(wbTitle)} ${T('wbTitle')}</h1>
      <p class="sub" style="margin-bottom:16px">${esc(p.nativeName||'')} · <b>${total}</b> ${T('words')}</p>
      <div class="card">
        <input type="search" id="wbSearch" class="wb-search" placeholder="${esc(T('wbSearch'))}" value="${esc(wbState.q)}" oninput="App.wbSetQuery(this.value)">
        <div class="wb-chips">${chips}</div>
        <div class="wb-bar">
          <span class="wb-count" id="wbCount">${wbFilteredWords().length}${T('wbShown')}</span>
          <div class="wb-mode">
            <button class="wb-chip ${m==='table'?'on':''}" onclick="App.wbSetMode('table')">${T('wbTable')}</button>
            <button class="wb-chip ${m==='cards'?'on':''}" onclick="App.wbSetMode('cards')">${T('wbCards')}</button>
          </div>
        </div>
        <div id="wbResults">${wbResultsHtml()}</div>
      </div>`;
  }
  function wbSetQuery(v){
    wbState.q = v;
    const res = $('#wbResults'), cnt = $('#wbCount');
    if(res) res.innerHTML = wbResultsHtml();
    if(cnt) cnt.textContent = wbFilteredWords().length + T('wbShown');
  }
  function wbSetCat(id){ wbState.cat = id; render(); }
  function wbSetMode(m){ wbState.mode = m; localStorage.setItem('3ls.wbMode', m); render(); }
  // 📚 버튼 토글: 단어은행이 열려 있으면 학습 홈으로, 아니면 단어은행으로
  function toggleWordbank(){ go(view.name==='wordbank' ? 'home' : 'wordbank'); }

  /* ── 통합검색: 설치된 모든 언어팩(빈 껍데기 제외)의 단어를 한번에 검색 ─ */
  function gsPackLabel(p){
    return p.extra ? (p.menuLabel||p.name) : targetName(p.target);
  }
  /* 통합검색 인덱스: 매 키 입력마다 전 팩을 norm() 하면 팩이 늘수록 급격히 느려진다.
     (측정: 4,900단어에서 키당 54ms). 검색 대상 문자열을 미리 한 번만 정규화해 캐시한다.
     팩이 추가/가져오기되면 팩 개수가 달라지므로 그때 자동으로 다시 만든다. */
  let gsIndex = null, gsIndexSize = -1;
  function buildSearchIndex(){
    const idx = [];
    Object.values(LANGUAGE_PACKS).forEach(p=>{
      if(isEmptyPack(p)) return;
      p.levels.forEach(L=>(L.words||[]).forEach(w=>{
        const hay = [w.w, w.ipa, w.ex].concat(w.m?Object.values(w.m):[]).concat(w.exm?Object.values(w.exm):[]);
        idx.push({w, p, L, hay: hay.map(x=>norm(x||'')).filter(Boolean).join('')});
      }));
    });
    gsIndex = idx; gsIndexSize = Object.keys(LANGUAGE_PACKS).length;
    return idx;
  }
  function gsFilteredResults(q){
    const nq = norm(q).trim();
    if(!nq) return [];
    if(!gsIndex || gsIndexSize !== Object.keys(LANGUAGE_PACKS).length) buildSearchIndex();
    const out = [];
    for(const e of gsIndex){ if(e.hay.includes(nq)) out.push(e); }
    return out;
  }
  function gsResultsHtml(){
    const q = gsState.q;
    if(!q.trim()) return `<div class="empty" style="padding:26px 0">${T('gsEmpty')}</div>`;
    const results = gsFilteredResults(q);
    if(!results.length) return `<div class="empty" style="padding:26px 0">${T('noResult')}</div>`;
    return `<div class="wb-cards">` + results.map(({w,p,L})=>{
      const meaning = meaningOf(w) || (w.m && Object.values(w.m).find(v=>String(v||'').trim())) || '';
      return `<div class="wb-card" onclick="App.gsGoTo('${p.id}',${L.level})">
        <div class="wb-card-front">
          <span class="wb-card-word">${p.flag||''} ${esc(w.w)}${genderTag(w.gender)}</span>
          ${p.tts? `<button class="speak" onclick="event.stopPropagation(); App.speak('${jattr(sayOf(w))}','${p.tts}')" title="${esc(T('ttSpeakW'))}">🔊</button>`:''}
        </div>
        <div class="wb-card-back" style="display:block; margin-top:8px; padding-top:8px">
          <span class="pill gray">${esc(gsPackLabel(p))}</span>
          ${w.ipa? `<div class="w-ipa">${esc(w.ipa)}</div>`:''}
          ${meaning? `<div class="wb-card-ko">${esc(meaning)}</div>`:''}
          ${w.ex? `<div class="wb-card-ex">${esc(w.ex)}</div>`:''}
        </div>
      </div>`;
    }).join('') + `</div>`;
  }
  function searchView(){
    if(!gsState) gsState = {q:''};
    return `<h1>🔎 ${T('gsTitle')}</h1>
      <p class="sub" style="margin-bottom:16px">${T('gsHint')}</p>
      <div class="card">
        <input type="search" id="gsSearch" class="wb-search" placeholder="${esc(T('gsPlaceholder'))}" value="${esc(gsState.q)}" oninput="App.gsSetQuery(this.value)">
        <div id="gsResults">${gsResultsHtml()}</div>
      </div>`;
  }
  // 타이핑 중에는 그리기를 미룬다(디바운스). 빠르게 치면 마지막 한 번만 렌더.
  let gsTimer = null;
  function gsSetQuery(v){
    gsState.q = v;
    clearTimeout(gsTimer);
    gsTimer = setTimeout(()=>{
      const res = $('#gsResults');
      if(res) res.innerHTML = gsResultsHtml();
    }, 120);
  }
  // 🔎 버튼 토글: 통합검색이 열려 있으면 학습 홈으로, 아니면 통합검색으로
  function toggleSearch(){ go(view.name==='search' ? 'home' : 'search'); }
  // 검색 결과 클릭: 그 언어로 전환 후 해당 레벨의 단어 탭으로 이동
  function gsGoTo(id, level){ switchLang(id, {name:'level', arg:level, tab:'words'}); }

  /* ── 플래시카드 ─────────────────────────────────── */
  function flashTab(L){
    // level을 붙여야 SRS 키가 복습 화면(allWords 기반)과 같아진다
    if(!flash) flash = {cards: shuffle((L.words||[]).map(w=>({...w, level:L.level}))), i:0, open:false};
    if(flash.i >= flash.cards.length)
      return `<div class="card flashwrap"><div class="scorebig">🎉</div>
        <p class="resultmsg">${T('flashDone')}</p>
        <p class="sub" style="margin-top:6px">${T('flashDoneSub')}</p>
        <div class="flashbtns"><button class="btn primary" onclick="App.flashRestart()">${T('oneMore')}</button></div></div>`;
    const w = flash.cards[flash.i];
    const front = `<div class="big">${esc(w.w)}</div><div class="ipa">${esc(w.ipa||'')} ${genderTag(w.gender)}</div>
      <div class="ex sub">${T('fcTap')}</div>`;
    const back = `<div class="big">${esc(w.w)}</div><div class="ipa">${esc(w.ipa||'')}</div>
      <div class="meaning">${esc(meaningOf(w))}</div>
      ${w.ex? `<div class="ex">${esc(w.ex)}${exmOf(w)?`<br>${esc(exmOf(w))}`:''}</div>`:''}`;
    return `<div class="flashwrap">
      <p class="sub">${flash.i+1} / ${flash.cards.length}</p>
      <div class="flashcard" onclick="App.flashFlip()">${flash.open? back: front}</div>
      <div class="flashbtns">
        ${pack().tts? `<button class="btn" onclick="App.speak('${jattr(sayOf(w))}')">${T('fcPron')}</button>`:''}
        ${flash.open? `<button class="btn bad" onclick="App.flashMark(false)">${T('fcDont')}</button>
        <button class="btn good" onclick="App.flashMark(true)">${T('fcKnow')}</button>`
        : `<button class="btn primary" onclick="App.flashFlip()">${T('fcMeaning')}</button>`}
      </div></div>`;
  }
  function flashFlip(){ if(flash){ flash.open=!flash.open; if(flash.open) speak(sayOf(flash.cards[flash.i])); render(); } }
  function flashMark(known){ srsMark(flash.cards[flash.i], known); flash.i++; flash.open=false; render(); }
  function flashRestart(){ flash=null; render(); }

  /* ── 읽기(원문 강독 · 장문) ──────────────────────────
     레벨에 reading 을 두면 📜 탭이 생긴다. 하나면 객체, 여러 편이면 배열:
       reading: { title, source, intro, after, gloss:{…}, lines:[…] }
       reading: [ {id:'gen-1', title:'…', lines:[…]}, {id:'gen-2', …} ]   ← 목차 드롭다운
     lines 의 각 줄: { n:'1:3'(표지), t:'원문', m:{kr:'번역'},
                      note:[{w:'낱말', m:'주석'}], say:'발음용', p:true(문단 나눔) }
     · 번역은 기본으로 감춰 두고 줄을 누르면 펼친다. 상단 버튼으로 전체 토글.
     · 낱말을 더블클릭하면 뜻 풍선이 뜬다(줄 주석 → 글 용어집 → 설치된 사전 순).
     · 읽던 위치·글자 크기는 기기에 저장돼 다음에 그 자리에서 이어진다. */
  function readDocs(L){
    const r = L && L.reading;
    if(!r) return [];
    return Array.isArray(r) ? r : [r];
  }
  let readShow = localStorage.getItem('3ls.readShow')==='1';
  let rdFont   = parseFloat(localStorage.getItem('3ls.rdFont')) || 1;
  let rdDocIdx = null;      // 지금 보고 있는 편(장) — null이면 저장된 마지막 편
  let rdQuery  = '';        // 이 글 안에서만 쓰는 검색어 (통합검색과 무관)
  let rdPending = null;     // 렌더 직후 스크롤할 줄 번호

  // 읽던 위치: 레벨당 키 하나에 { <편 번호>: <줄 번호>, _last: <편 번호> }
  function rdKey(L){ return '3ls.rd.' + S.activeLang + '.' + (L.level != null ? L.level : 0); }
  function rdPos(L){ try{ return JSON.parse(localStorage.getItem(rdKey(L))||'{}'); }catch(e){ return {}; } }
  function rdSavePos(L, d, i){
    const o = rdPos(L); o[d] = i; o._last = d;
    localStorage.setItem(rdKey(L), JSON.stringify(o));
  }
  function rdCurDoc(L){
    const docs = readDocs(L);
    if(rdDocIdx!=null && docs[rdDocIdx]) return rdDocIdx;
    const last = rdPos(L)._last;
    return (last!=null && docs[last]) ? Number(last) : 0;
  }
  // 지금 화면의 레벨 객체 (읽기 도구들이 공통으로 쓴다)
  function rdLevel(){ return pack() && pack().levels.find(x=>x.level===view.arg); }

  function readingTab(L){
    const docs = readDocs(L);
    if(!docs.length) return `<div class="empty">${T('noRead')}</div>`;
    const d = rdCurDoc(L), R = docs[d] || {}, lines = R.lines || [];
    const tts = pack().tts, pos = rdPos(L), saved = pos[d];

    const toc = docs.length>1 ? `<select class="read-toc" onchange="App.rdDoc(this.value)">` +
      docs.map((x,i)=>{
        const tot = (x.lines||[]).length, at = pos[i];
        const pct = (at!=null && tot) ? ` — ${Math.round((at+1)/tot*100)}%` : '';
        return `<option value="${i}" ${i===d?'selected':''}>${esc(x.title||('#'+(i+1)))}${pct}</option>`;
      }).join('') + `</select>` : '';

    const head = `<div class="read-head">
        <div>
          <h3 class="read-title">${esc(R.title||'')}</h3>
          ${R.source? `<div class="read-src">${esc(R.source)}</div>`:''}
        </div>
        <button class="wb-chip ${readShow?'on':''}" onclick="App.toggleRead()">${readShow?T('rdHide'):T('rdShow')}</button>
      </div>
      <div class="read-bar">${toc}
        <input type="search" class="read-find" id="rdFind" placeholder="${esc(T('rdFind'))}"
               value="${esc(rdQuery)}" oninput="App.rdSearch(this.value)">
        <span class="read-size">
          <button onclick="App.rdZoom(-1)" title="${esc(T('rdSmaller'))}">A−</button>
          <button onclick="App.rdZoom(1)" title="${esc(T('rdBigger'))}">A＋</button>
        </span>
      </div>`;

    // 이어읽기: 저장된 위치가 첫 줄이 아닐 때만 띄운다
    const mark = (lines[saved] && lines[saved].n) || (saved+1);
    const resume = (saved!=null && saved>0) ? `<div class="read-resume">
        <span>${TF('rdAt',{n: esc(String(mark))})}</span>
        <button class="wb-chip on" onclick="App.rdJump(${saved})">${T('rdResume')}</button>
      </div>` : '';

    const intro = R.intro? `<div class="hint" style="margin-bottom:14px">${R.intro}</div>` : '';
    const body = lines.map((ln,i)=>{
      const tr = meaningOf(ln);           // m:{kr:…} 를 현재 base로
      const notes = (ln.note||[]).map(n=>`<span class="read-note"><b>${esc(n.w)}</b> ${esc(n.m)}</span>`).join('');
      const say = ln.say || ln.t;
      return `${ln.p?'<div class="read-gap"></div>':''}
        <div class="read-line ${readShow?'open':''}" data-i="${i}" onclick="App.rdTapLine(this)">
          <div class="read-t">${ln.n? `<span class="read-n">${esc(ln.n)}</span>`:''}${esc(ln.t)}${(tts&&ln.t)?`<button class="speak" onclick="event.stopPropagation(); App.speak('${jattr(say)}')" title="${esc(T('ttSpeakW'))}">🔊</button>`:''}</div>
          ${tr? `<div class="read-m">${esc(tr)}</div>`:''}
          ${notes? `<div class="read-notes">${notes}</div>`:''}
        </div>`;
    }).join('');
    const after = R.after? `<div class="grammarbox" style="margin-top:16px">${R.after}</div>` : '';
    return `<div class="card">${head}${resume}<div class="read-hits" id="rdHits" hidden></div>${intro}
      <div class="read-body" id="rdBody" style="font-size:${rdFont}rem"
           ondblclick="App.rdLookup(event)">${body}</div>${after}</div>`;
  }

  function toggleRead(){
    readShow = !readShow;
    localStorage.setItem('3ls.readShow', readShow?'1':'0');
    render();
  }
  /* 줄 한 번 클릭 = 번역 펼치기. 다만 더블클릭(낱말 조회) 앞에도 click 이 두 번
     먼저 오므로, 그대로 토글하면 번역이 열렸다 닫히며 깜박인다.
     잠긐 미뤄 두었다가 더블클릭이 오면 취소한다. */
  let rdTapTimer = null;
  function rdTapLine(el){
    clearTimeout(rdTapTimer);
    rdTapTimer = setTimeout(()=>el.classList.toggle('open'), 220);
  }
  function rdDoc(i){ rdDocIdx = Number(i); rdQuery=''; render(); window.scrollTo(0,0); }
  function rdZoom(dir){
    rdFont = Math.min(1.8, Math.max(.8, Math.round((rdFont + dir*.1)*10)/10));
    localStorage.setItem('3ls.rdFont', String(rdFont));
    const b = $('#rdBody'); if(b) b.style.fontSize = rdFont+'rem';
  }
  // 특정 줄로 스크롤 + 잠깐 강조
  function rdJump(i){
    const el = document.querySelector('.read-line[data-i="'+i+'"]');
    if(!el) return;
    el.scrollIntoView({block:'center'});
    requestAnimationFrame(()=>el.scrollIntoView({block:'center'}));
    el.classList.add('hit');
    setTimeout(()=>el.classList.remove('hit'), 1200);
  }

  /* 이 글 안에서만 찾기 — 통합검색 인덱스(gsIndex)와 완전히 분리돼 단어 결과와 안 섞인다.
     장문이라도 lines 배열을 한 번 훑는 것이라 인덱스가 필요 없다(3,000줄에 1ms 미만). */
  let rdTimer = null;
  function rdSearch(v){
    rdQuery = v;
    clearTimeout(rdTimer);
    rdTimer = setTimeout(()=>{
      const box = $('#rdHits'), L = rdLevel();
      if(!box || !L) return;
      const doc = readDocs(L)[rdCurDoc(L)] || {}, lines = doc.lines||[];
      const q = norm(v).trim();
      if(!q){ box.hidden = true; box.innerHTML=''; return; }
      const hits = [];
      for(let i=0;i<lines.length && hits.length<100;i++){
        const ln = lines[i];
        const hay = norm((ln.n||'') + ' ' + (ln.t||'') + ' ' + (meaningOf(ln)||''));
        if(hay.includes(q)) hits.push({i, ln});
      }
      box.hidden = false;
      box.innerHTML = hits.length
        ? hits.map(({i,ln})=>`<div class="read-hit" onclick="App.rdJump(${i})">
            ${ln.n? `<b>${esc(ln.n)}</b> `:''}${esc(String(ln.t||'').slice(0,110))}</div>`).join('')
        : `<div class="read-hit" style="cursor:default">${T('noResult')}</div>`;
    }, 120);
  }

  /* 낱말 뜻 풍선 — 낱말마다 <span>을 감싸면 장문에서 노드가 수만 개가 된다.
     더블클릭이면 브라우저가 알아서 낱말을 선택하므로 selection만 읽으면 DOM 추가가 0.
     한 번 클릭(번역 펼치기)과도 안 겹친다. */
  function rdNorm(s){
    return String(s||'').toLowerCase().normalize('NFD')
      .replace(/[̀-ͯ]/g,'').replace(/[^\p{L}\p{N}]/gu,'');
  }
  let rdLexMap = null, rdLexSize = -1;
  function rdLex(){
    const n = Object.keys(LANGUAGE_PACKS).length;
    if(rdLexMap && rdLexSize===n) return rdLexMap;
    const m = new Map();
    Object.values(LANGUAGE_PACKS).forEach(p=>(p.levels||[]).forEach(L=>(L.words||[]).forEach(w=>{
      const k = rdNorm(w.w); if(k && !m.has(k)) m.set(k, {w, p});
    })));
    rdLexMap = m; rdLexSize = n;
    return m;
  }
  function rdLookup(ev){
    clearTimeout(rdTapTimer);          // 더블클릭이니 줄 토글은 취소
    const sel = window.getSelection();
    const raw = sel ? String(sel).trim() : '';
    rdClosePop();
    const key = rdNorm(raw);
    if(!key || key.length>40) return;

    const L = rdLevel(); if(!L) return;
    const doc = readDocs(L)[rdCurDoc(L)] || {};
    const lineEl = ev.target.closest ? ev.target.closest('.read-line') : null;
    const ln = lineEl ? (doc.lines||[])[Number(lineEl.dataset.i)] : null;

    let m = '', src = '';
    // ① 그 줄에 저자가 직접 단 주석이 가장 정확하다
    const note = ln && (ln.note||[]).find(x=>rdNorm(x.w)===key);
    if(note){ m = note.m; src = T('rdSrcNote'); }
    // ② 용어집 — 굴절형까지 담는 자리. 편별 gloss 가 먼저, 없으면 팩 전체 gloss.
    for(const g of [doc.gloss, pack().gloss]){
      if(m || !g) continue;
      for(const k in g){ if(rdNorm(k)===key){ m = g[k]; src = T('rdSrcGloss'); break; } }
    }
    // ③ 설치된 사전의 표제어 정확 일치 — 굴절형은 여기서 안 잡힌다(지어내지 않는다)
    let hitW = null, hitP = null;
    if(!m){
      const e = rdLex().get(key);
      if(e){
        hitW = e.w; hitP = e.p;
        m = meaningOf(e.w) || (e.w.m && Object.values(e.w.m).find(v=>String(v||'').trim())) || '';
        src = gsPackLabel(e.p);
      }
    }
    const say = hitW ? sayOf(hitW) : raw;
    // 찾은 낱말이 다른 팩에서 왔으면 그 팩의 로케일로 읽는다(통합검색과 같은 방식)
    const sayTts = (hitP && hitP.tts) || pack().tts;
    const pop = document.createElement('div');
    pop.className = 'rd-pop'; pop.id = 'rdPop';
    pop.innerHTML = `<div class="rp-w">${esc(raw)}</div>
      ${src? `<div class="rp-src">${esc(src)}</div>`:''}
      <div class="rp-m">${m? esc(m) : `<span class="sub">${T('rdNoEntry')}</span>`}</div>
      <div class="rp-act">
        ${sayTts? `<button onclick="App.speak('${jattr(say)}','${jattr(sayTts)}')">🔊</button>`:''}
        <button onclick="App.rdToSearch('${jattr(raw)}')">🔎 ${T('gsTitle')}</button>
      </div>`;
    document.body.appendChild(pop);
    // 선택 영역 근처에 띄우되 화면 밖으로 나가지 않게 민다
    let x = ev.clientX, y = ev.clientY;
    try{ const r = sel.getRangeAt(0).getBoundingClientRect(); if(r && r.width){ x = r.left; y = r.bottom; } }catch(e){}
    const w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px';
    pop.style.top  = (y + h + 12 > innerHeight ? Math.max(8, y - h - 10) : y + 8) + 'px';
    setTimeout(()=>document.addEventListener('pointerdown', function away(e){
      if(e.target.closest && e.target.closest('.rd-pop')){        // 팝업 안이면 그대로 두고
        document.addEventListener('pointerdown', away, {once:true});  // 다음 바깥 클릭을 다시 기다린다
        return;
      }
      rdClosePop();
    }, {once:true}), 0);
  }
  function rdClosePop(){ const e = document.getElementById('rdPop'); if(e) e.remove(); }
  function rdToSearch(q){ rdClosePop(); go('search'); gsState = {q}; render(); }

  /* 읽던 위치 저장: 화면 맨 위에 걸린 줄을 기록한다. 스크롤마다 하면 비싸니 디바운스. */
  let rdScrollTimer = null;
  function rdTrackScroll(){
    if(view.name!=='level' || view.tab!=='read') return;
    clearTimeout(rdScrollTimer);
    rdScrollTimer = setTimeout(()=>{
      const els = document.querySelectorAll('.read-line');
      if(!els.length) return;
      let top = -1;
      for(const el of els){ if(el.getBoundingClientRect().bottom > 90){ top = Number(el.dataset.i)||0; break; } }
      // 맺음말까지 내려가 모든 줄이 화면 위로 지나간 경우 — 마지막 줄로 본다.
      // 0 으로 두면 다 읽고 나갈 때마다 저장된 위치가 지워진다.
      if(top < 0) top = (scrollY + innerHeight >= document.body.scrollHeight - 40) ? els.length-1 : -1;
      const L = rdLevel();
      if(L && top >= 0) rdSavePos(L, rdCurDoc(L), top);
    }, 400);
  }

  function grammarTab(L){
    if(!(L.grammar||[]).length) return `<div class="empty">${T('noGrammar')}</div>`;
    return L.grammar.map(g=>`<div class="card"><div class="grammarbox"><h3>${esc(g.title)}</h3>${g.html}</div></div>`).join('');
  }

  /* ── 연습 문제 렌더러(4종: choice / blank / blocks / compose) ── */
  function exTab(L){
    if(!(L.exercises||[]).length) return `<div class="empty">${T('noEx')}</div>`;
    const html = L.exercises.map((ex,i)=>`<div class="card exercise" id="ex-${i}">
      <div class="ex-num">${T('exNum')} ${i+1} / ${L.exercises.length} ${langState().doneEx['L'+L.level]?.[i]? `<span class="pill green">${T('done')}</span>`:''}</div>
      ${renderExercise(ex, 'ex', i)}</div>`).join('');
    return html;
  }

  function renderExercise(ex, ns, i){
    const id = ns+'-'+i;
    if(ex.type==='choice'){
      return `<div class="ex-prompt">${esc(ex.q)}</div>
        ${(ex.audio && pack().tts)? `<button class="btn" style="margin-bottom:10px" onclick="App.speak('${jattr(ex.audio)}')">${T('listen')}</button>`:''}
        <div id="${id}-opts">${ex.options.map((o,oi)=>`<button class="choiceopt" onclick="App.pickChoice('${ns}',${i},${oi})">${esc(o)}</button>`).join('')}</div>
        <div class="feedback" id="${id}-fb"></div>${ex.hint?`<div class="hint">💡 ${esc(ex.hint)}</div>`:''}`;
    }
    if(ex.type==='blank'){
      const parts = ex.text.split('___');
      let line = '';
      parts.forEach((p,pi)=>{
        line += esc(p);
        if(pi < parts.length-1) line += `<input class="blankinput" id="${id}-in-${pi}" dir="auto" autocomplete="off" autocapitalize="off">`;
      });
      const ansArr = Array.isArray(ex.answer)? ex.answer : [ex.answer];
      let bi = 0;
      const spoken = ex.text.replace(/___/g, () => ansArr[bi++] ?? ''); // 각 빈칸에 대응하는 정답으로 치환해 읽기
      return `<div class="ex-prompt">${esc(ex.prompt||T('fillBlank'))} ${ex.ko?`<span class="sub">(${esc(ex.ko)})</span>`:''}</div>
        <div class="blankline">${line}
        ${pack().tts? `<button class="speak" onclick="App.speak('${jattr(spoken)}')">🔊</button>`:''}</div>
        ${charBar(id)}
        <div class="flashbtns" style="justify-content:flex-start"><button class="btn primary" onclick="App.checkBlank('${ns}',${i})">${T('check')}</button></div>
        <div class="feedback" id="${id}-fb"></div>${ex.hint?`<div class="hint">💡 ${esc(ex.hint)}</div>`:''}`;
    }
    if(ex.type==='blocks'){
      const answerTokens = ex.answer.split(' ');
      const tokens = shuffle(answerTokens.concat(ex.distractors||[]));
      window.__blocks = window.__blocks || {};
      window.__blocks[id] = {pool: tokens, ans: [], solution: answerTokens};
      return `<div class="ex-prompt">${T('blocksPrompt')} <span class="sub">"${esc(ex.ko)}"</span></div>
        <div class="blockanswer" id="${id}-ans"></div>
        <div class="blockpool" id="${id}-pool"></div>
        <div class="flashbtns" style="justify-content:flex-start">
          <button class="btn primary" onclick="App.checkBlocks('${ns}',${i})">${T('check')}</button>
          <button class="btn" onclick="App.resetBlocks('${ns}',${i})">${T('again')}</button>
          ${pack().tts? `<button class="btn" onclick="App.speak('${jattr(ex.answer)}')">${T('listenAns')}</button>`:''}</div>
        <div class="feedback" id="${id}-fb"></div>${ex.hint?`<div class="hint">💡 ${esc(ex.hint)}</div>`:''}`;
    }
    if(ex.type==='compose'){
      return `<div class="ex-prompt">${esc(ex.prompt)}</div>
        <textarea class="compose" id="${id}-in" dir="auto" placeholder="${esc(T('composePh'))}"></textarea>
        ${charBar(id, true)}
        <div class="flashbtns" style="justify-content:flex-start"><button class="btn primary" onclick="App.checkCompose('${ns}',${i})">${T('composeBtn')}</button></div>
        <div class="feedback" id="${id}-fb"></div>`;
    }
    return '';
  }
  function charBar(id, ta){
    const chars = pack().specialChars||[];
    if(!chars.length) return '';
    return `<div class="charbar">${chars.map(c=>`<button onclick="App.insertChar('${id}','${c}',${!!ta})">${c}</button>`).join('')}</div>`;
  }
  function insertChar(id, c, ta){
    const el = ta? document.getElementById(id+'-in')
      : (document.activeElement.classList?.contains('blankinput') ? document.activeElement : document.getElementById(id+'-in-0'));
    if(!el) return;
    const s = el.selectionStart??el.value.length, e2 = el.selectionEnd??el.value.length;
    el.value = el.value.slice(0,s)+c+el.value.slice(e2);
    el.focus(); el.selectionStart = el.selectionEnd = s+1;
  }

  function currentItems(ns){
    if(ns==='ex'){ const L = pack().levels.find(x=>x.level===view.arg); return L.exercises; }
    return quiz.items;
  }
  function fb(id, cls, html){
    const f = document.getElementById(id+'-fb');
    f.className = 'feedback show '+cls; f.innerHTML = html;
  }
  function markDone(ns, i, correct){
    if(ns==='ex' && correct){
      const st = langState(); const key='L'+view.arg;
      st.doneEx[key] = st.doneEx[key]||{}; st.doneEx[key][i]=true; save();
      const numEl = document.querySelector('#ex-'+i+' .ex-num');
      if(numEl && !numEl.querySelector('.pill')) numEl.insertAdjacentHTML('beforeend',` <span class="pill green">${T('done')}</span>`);
    }
    if(ns==='quiz'){ quiz.graded[i] = !!correct; }
  }

  /* 채점: choice */
  function pickChoice(ns, i, oi){
    const ex = currentItems(ns)[i], id = ns+'-'+i;
    const opts = document.querySelectorAll('#'+id+'-opts .choiceopt');
    if(quizLockedOrDone(ns,i)) return;
    opts.forEach((b,bi)=>{
      b.disabled = true;
      if(bi===ex.answer) b.classList.add('correct');
      else if(bi===oi) b.classList.add('wrong');
    });
    const ok = oi===ex.answer;
    fb(id, ok?'ok':'no', ok? T('correct') : TF('wrongIs',{a:esc(ex.options[ex.answer])}) + (ex.why? '<br>'+esc(ex.why):''));
    markDone(ns,i,ok); afterGrade(ns);
  }
  /* 채점: blank */
  function checkBlank(ns, i){
    const ex = currentItems(ns)[i], id = ns+'-'+i;
    if(quizLockedOrDone(ns,i)) return;
    const answers = Array.isArray(ex.answer)? ex.answer : [ex.answer];
    let allOk = true, got=[];
    answers.forEach((a,ai)=>{
      const inp = document.getElementById(id+'-in-'+ai);
      const val = inp? inp.value : '';
      got.push(val);
      const accepted = [a].concat(ex.accept?.[ai]||ex.accept||[]).filter(x=>typeof x==='string');
      if(!accepted.some(acc=>normAns(acc)===normAns(val))) allOk=false;
    });
    fb(id, allOk?'ok':'no', allOk? T('correct')
      : TF('wrongAns',{a:answers.map(esc).join(', ')}) + (ex.why? '<br>'+esc(ex.why):''));
    markDone(ns,i,allOk); afterGrade(ns);
  }
  /* 채점: blocks */
  function paintBlocks(id){
    const B = window.__blocks[id]; if(!B) return;
    const pool = document.getElementById(id+'-pool'), ans = document.getElementById(id+'-ans');
    if(!pool||!ans) return;
    pool.innerHTML = B.pool.map((t,ti)=>`<button class="block" onclick="App.moveBlock('${id}',${ti},true)">${esc(t)}</button>`).join('');
    ans.innerHTML = B.ans.map((t,ti)=>`<button class="block" onclick="App.moveBlock('${id}',${ti},false)">${esc(t)}</button>`).join('')
      || `<span class="sub" style="align-self:center">${T('blocksHere')}</span>`;
  }
  function moveBlock(id, ti, toAns){
    const B = window.__blocks[id];
    if(toAns){ B.ans.push(B.pool.splice(ti,1)[0]); } else { B.pool.push(B.ans.splice(ti,1)[0]); }
    paintBlocks(id);
  }
  function resetBlocks(ns,i){
    const id=ns+'-'+i, B=window.__blocks[id];
    B.pool = shuffle(B.pool.concat(B.ans)); B.ans=[]; paintBlocks(id);
    const f=document.getElementById(id+'-fb'); f.className='feedback';
  }
  function checkBlocks(ns, i){
    const ex = currentItems(ns)[i], id = ns+'-'+i, B = window.__blocks[id];
    if(quizLockedOrDone(ns,i)) return;
    // 어순이 자유로운 언어(라틴어 등)를 위해 복수 정답 허용: ex.answers 에 나머지를 적는다
    const got = normAns(B.ans.join(' '));
    const list = answerList(ex);
    const hit = list.find(a=>normAns(a)===got);
    const ok = !!hit;
    fb(id, ok?'ok':'no', ok? TF('correctIs',{a:esc(hit)})
      : TF('wrongAns',{a:esc(ex.answer)}) + (ex.why? '<br>'+esc(ex.why):''));
    if(ok) speak(hit);
    markDone(ns,i,ok); afterGrade(ns);
  }
  /* 채점: compose(자유 작문 휴리스틱 피드백) */
  function checkCompose(ns, i){
    const ex = currentItems(ns)[i], id = ns+'-'+i;
    const val = document.getElementById(id+'-in').value.trim();
    const issues = [];
    // 길이 판정: 공백으로 단어를 나누지 않는 언어(중국어·일본어·태국어 등)에서는
    // 공백 분리가 항상 1이 되어 최소 단어 조건이 영구 실패한다.
    // 공백이 거의 없는 문자열이면 글자 수로 판정한다. 팩이 minChars로 직접 지정도 가능.
    const words = val.split(/\s+/).filter(Boolean);
    // 한중일·태국·크메르·라오 문자가 섞이면 글자 수로 센다 (이 언어들은 띄어쓰기를 하지 않음)
    const SPACELESS = /[぀-ヿ㐀-鿿豈-﫿฀-๿ក-៿຀-໿]/;
    if(ex.minChars || SPACELESS.test(val)){
      const need = ex.minChars || ex.minWords || 5;   // 글자 하나가 형태소급이라 그대로 비교
      if([...val].length < need) issues.push(TF('tooShortChars',{n:need}));
    }else if(words.length < (ex.minWords||5)) issues.push(TF('tooShort',{n:ex.minWords||5}));
    (ex.mustInclude||[]).forEach(k=>{
      const keys = Array.isArray(k)? k : [k];
      if(!keys.some(kk=>norm(val).includes(norm(kk)))) issues.push(TF('mustUse',{k:keys[0]}));
    });
    // 대문자 검사: 대소문자가 없는 문자 체계(CJK·아랍어 등)에서는 toUpperCase()가 자기 자신이라
    // 자동으로 통과한다. 팩이 checkCase:false 로 끌 수도 있다.
    if(ex.checkCase!==false && val && val[0] !== val[0].toUpperCase()) issues.push(T('capStart'));
    // 종결부호: 라틴 문자권의 . ! ? 만 보면 일본어 。중국어 。아랍어 ؟ 그리스어 ; 가 전부 오탐.
    // 팩이 endPunct(문자열 또는 배열)로 직접 지정 가능.
    const ENDS = ex.endPunct ? [].concat(ex.endPunct) : ['.','!','?','。','！','？','؟','۔','；',';','…'];
    if(ex.checkEnd!==false && val && !ENDS.some(e=>val.endsWith(e))) issues.push(T('endPunct'));
    const ok = val && issues.length===0;
    fb(id, ok?'ok':'info', ok
      ? `${T('composeOk')}<br><b>${T('sampleAns')}</b> ${esc(ex.sample)}<br><span class="sub">${T('composeNote')}</span>`
      : `${T('polish')}<ul>${issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><span class="sub">${T('hintSample')} ${esc(ex.sample)}</span>`);
    markDone(ns,i,ok); afterGrade(ns);
  }
  function quizLockedOrDone(ns,i){ return ns==='quiz' && quiz && quiz.graded[i]!==undefined && quiz.graded[i]!==null; }

  /* ── 마일스톤 시험 ──────────────────────────────── */
  function quizTab(L){
    const st = langState();
    if(!(L.quiz||[]).length) return `<div class="empty">${T('noQuiz')}</div>`;
    if(!quiz){
      const best = st.quizBest[L.level];
      return `<div class="card" style="text-align:center">
        <h2>${TF('quizTitle',{n:L.level})}</h2>
        <p class="sub">${TF('quizIntro',{c:L.quiz.length, s:PASS_SCORE})}
        ${best!=null? `<br>${T('bestSoFar')} <b>${best}%</b>`:''}</p>
        <div class="flashbtns"><button class="btn primary" onclick="App.startQuiz()">${T('quizStart')}</button></div></div>`;
    }
    if(quiz.finished){
      const total = quiz.items.length;
      const okCount = quiz.graded.filter(Boolean).length;
      const score = Math.round(okCount/total*100);
      const passed = score >= PASS_SCORE;
      return `<div class="card">
        <div class="scorebig" style="color:${passed?'var(--good)':'var(--bad)'}">${TF('scorePts',{s:score})}</div>
        <p class="resultmsg">${passed? T('passMsg') : TF('failMsg',{s:PASS_SCORE})}</p>
        <div class="dots">${quiz.graded.map(g=>`<span class="${g?'ok':'no'}"></span>`).join('')}</div>
        <div class="flashbtns"><button class="btn primary" onclick="App.startQuiz()">${T('retry')}</button>
        <button class="btn" onclick="App.go('home')">${T('toMap')}</button></div></div>`;
    }
    const html = quiz.items.map((ex,i)=>`<div class="card exercise">
      <div class="ex-num">${T('qItem')} ${i+1} / ${quiz.items.length}</div>${renderExercise(ex,'quiz',i)}</div>`).join('');
    return `<div class="quizhead"><h2>${T('quizRunning')}</h2><span class="pill" id="quizProg">0 / ${quiz.items.length}</span></div>
      ${html}<div class="card" style="text-align:center" id="quizSubmitCard">
      <p class="sub">${T('quizAuto')}</p></div>`;
  }
  function startQuiz(){
    const L = pack().levels.find(x=>x.level===view.arg);
    quiz = {items: L.quiz||[], graded: new Array((L.quiz||[]).length).fill(null), finished:false};
    render();
  }
  function afterGrade(ns){
    if(ns!=='quiz'||!quiz) return;
    const done = quiz.graded.filter(g=>g!==null).length;
    const prog = $('#quizProg'); if(prog) prog.textContent = done+' / '+quiz.items.length;
    if(done === quiz.items.length){
      const okCount = quiz.graded.filter(Boolean).length;
      const score = Math.round(okCount/quiz.items.length*100);
      const st = langState(), L = view.arg;
      st.quizBest[L] = Math.max(st.quizBest[L]||0, score);
      if(score>=PASS_SCORE) st.unlocked = Math.max(st.unlocked, Math.min(L+1, pack().levels.length));
      save();
      // 900ms 사이에 화면·언어를 옮기면 quiz가 null이 되므로 가드
      setTimeout(()=>{ if(!quiz) return; quiz.finished=true; render(); }, 900);
    }
  }

  /* ── 복습(누적 SRS 큐) ──────────────────────────── */
  function reviewView(){
    const due = dueWords();
    if(!flash){
      if(!due.length) return `<h1>${T('revTitle')}</h1><div class="card empty">${T('revEmpty')}</div>`;
      flash = {cards: shuffle(due), i:0, open:false};
    }
    if(flash.i>=flash.cards.length)
      return `<h1>${T('revTitle')}</h1><div class="card flashwrap"><div class="scorebig">✅</div>
        <p class="resultmsg">${T('revDone')}</p><div class="flashbtns"><button class="btn primary" onclick="App.go('home')">${T('backHome')}</button></div></div>`;
    const w = flash.cards[flash.i];
    const front = `<div class="big">${esc(w.w)}</div><div class="ipa">${esc(w.ipa||'')} ${genderTag(w.gender)}</div>
      <div class="ex sub">${T('fcTap')}</div>`;
    const back = `<div class="big">${esc(w.w)}</div><div class="meaning">${esc(meaningOf(w))}</div>
      ${w.ex? `<div class="ex">${esc(w.ex)}${exmOf(w)?`<br>${esc(exmOf(w))}`:''}</div>`:''}`;
    return `<h1>${T('revTitle')} <span class="pill">${flash.cards.length - flash.i}</span></h1>
      <div class="flashwrap"><div class="flashcard" onclick="App.flashFlip()">${flash.open? back: front}</div>
      <div class="flashbtns">
        ${pack().tts? `<button class="btn" onclick="App.speak('${jattr(sayOf(w))}')">${T('fcPron')}</button>`:''}
        ${flash.open? `<button class="btn bad" onclick="App.flashMark(false)">${T('fcDont')}</button>
        <button class="btn good" onclick="App.flashMark(true)">${T('fcKnow')}</button>`
        : `<button class="btn primary" onclick="App.flashFlip()">${T('fcMeaning')}</button>`}
      </div></div>`;
  }

  /* ── 언어/콘텐츠 전환 & JSON 언어팩 가져오기 ─────── */
  // Contents 드롭다운(평면): 현재 (base,target)의 콘텐츠(본과정 + 확장 팩)를 나열.
  // 상단 "언어 선택…"으로 언어 선택 페이지(base·target)로 진입.
  function renderContentsMenu(){
    const panel = $('#contentsPanel'); if(!panel) return;
    const cur = LANGUAGE_PACKS[S.activeLang]; if(!cur){ panel.innerHTML=''; return; }
    const items = packsOfTarget(cur.target).filter(p=>!isEmptyPack(p) && packBases(p).has(curBase())).map(p=>{
      const on = p.id===S.activeLang;
      const label = p.extra ? (p.menuLabel||p.name) : targetName(p.target);
      return `<button class="menu-item" onclick="App.closeContents(); App.switchLang('${p.id}')">
        ${on?'● ':'○ '}${p.flag||''} ${esc(label)}${(p.dictionary && p.extra)?` <span class="r">${T('dict')}</span>`:''}</button>`;
    }).join('');
    panel.innerHTML = `<button class="menu-item" onclick="App.closeContents(); App.go('picker')">🌐 ${T('cChoose')}</button>
      <div class="menu-sep"></div>
      <div class="menu-label">${T('cContents')}</div>${items}`;
  }
  function switchLang(id, nav){
    if(!LANGUAGE_PACKS[id]) return;
    id = resolvePack(id);              // 빈 껍데기 언어면 1순위 확장 사전으로 redirect
    const p = LANGUAGE_PACKS[id];
    // 현재 base가 이 팩에 없으면, 팩이 지원하는 base로 전환(kr 우선)
    if(!packBases(p).has(curBase())){ const bs=[...packBases(p)]; if(bs.length) S.base = bs.includes('kr')?'kr':bs[0]; }
    S.activeLang = id;
    save(); applyI18n(); renderContentsMenu();
    if(nav){ go(nav.name, nav.arg); if(nav.tab){ view.tab = nav.tab; render(); } }
    else go('home');
  }
  function importPack(input){
    const f = input.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const pk = JSON.parse(r.result);
        registerLanguagePack(pk);
        if(!LANGUAGE_PACKS[pk.id]) throw new Error('스키마 오류');
        const customs = JSON.parse(localStorage.getItem(PACKS_KEY)||'{}');
        customs[pk.id] = pk;
        localStorage.setItem(PACKS_KEY, JSON.stringify(customs));
        S.activeLang = resolvePack(pk.id);
        const bs=[...packBases(LANGUAGE_PACKS[S.activeLang])]; if(bs.length && !bs.includes(curBase())) S.base = bs.includes('kr')?'kr':bs[0];
        save(); applyI18n(); renderContentsMenu(); go('home');
        alert(TF('packLoaded',{n:pk.name}));
      }catch(e){ alert(TF('packFail',{e:e.message})); }
    };
    r.readAsText(f); input.value='';
  }

  /* ── 서재: 원서 파일 선택 다운로드 ──────────────────────
     library/index.json 의 목록만 먼저 읽고, [받기]를 누른 문서만 내려받는다.
     앱을 켜는 것만으로는 원서를 한 바이트도 받지 않는다 — service-worker.js 의
     APP_SHELL 에 library/ 를 넣지 않았기 때문이다.
     받은 파일은 버전이 안 붙은 '3ls-library' 캐시에 넣어 앱을 업데이트해도 살아남는다
     (버전 캐시에 두면 activate 가 옛 캐시를 지울 때 같이 날아간다).
     받은 문서는 그냥 언어팩이므로 목차·읽기·검색 등 나머지 기능은 그대로 쓴다. */
  const LIB_CACHE = '3ls-library';
  const LIB_KEY   = '3ls.lib';        // { <팩 id>: <내려받은 URL> }
  let libState = null;                // { list, err, busy }

  function libMap(){ try{ return JSON.parse(localStorage.getItem(LIB_KEY)||'{}'); }catch(e){ return {}; } }
  function libSetMap(o){ localStorage.setItem(LIB_KEY, JSON.stringify(o)); }
  function libUrl(d){ return d.url || ('library/' + d.file); }   // 같은 저장소가 기본, 절대 URL도 허용
  function libOK(){ return typeof caches !== 'undefined'; }      // file:// 에는 Cache Storage 가 없다

  // 부팅: 받아둔 원서를 캐시에서 되살린다 (네트워크 없이도 열린다)
  async function libRestore(){
    if(!libOK()) return false;
    const map = libMap(), ids = Object.keys(map);
    if(!ids.length) return false;
    let n = 0;
    try{
      const c = await caches.open(LIB_CACHE);
      for(const id of ids){
        try{
          const res = await c.match(map[id]);
          if(!res) continue;
          registerLanguagePack(await res.json());
          if(LANGUAGE_PACKS[id]) n++;
        }catch(e){ console.warn('[서재] 복원 실패:', id, e); }
      }
    }catch(e){ console.warn('[서재] 캐시 열기 실패', e); }
    return n > 0;
  }

  async function libLoad(){
    try{
      const res = await fetch('library/index.json', {cache:'no-cache'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      if(!libState) return;                       // 불러오는 사이 화면을 나갔다
      libState.list = j.docs || [];
    }catch(e){
      if(!libState) return;
      libState.err = e.message; libState.list = [];
    }
    render();
  }

  function libraryView(){
    if(!libState){ libState = {list:null, err:null, busy:null}; libLoad(); }
    const map = libMap();
    const head = `<h1>📚 ${T('libTitle')}</h1>
      <p class="sub" style="margin-bottom:16px">${T('libHint')}</p>`;
    if(!libOK()) return head + `<div class="card"><div class="empty">${T('libNoCache')}</div></div>`;
    if(libState.list === null) return head + `<div class="card"><div class="empty">${T('libLoading')}</div></div>`;
    if(libState.err && !libState.list.length)
      return head + `<div class="card"><div class="empty">${TF('libErr',{e:esc(libState.err)})}</div></div>`;
    if(!libState.list.length) return head + `<div class="card"><div class="empty">${T('libNone')}</div></div>`;

    const rows = libState.list.map((d,i)=>{
      const have = !!map[d.id], busy = libState.busy===d.id;
      const meta = [ d.lines? TF('libLines',{n:Number(d.lines).toLocaleString()}) : '', d.size||'' ]
        .filter(Boolean).join(' · ');
      const btn = busy
        ? `<button class="btn" disabled>${T('libGetting')}</button>`
        : have
          ? `<button class="btn primary" onclick="App.libOpen('${jattr(d.id)}')">${T('libRead')}</button>
             <button class="btn" onclick="App.libDel('${jattr(d.id)}')">${T('libDel')}</button>`
          : `<button class="btn primary" onclick="App.libGet(${i})">${T('libGet')}</button>`;
      return `<div class="card" style="margin-bottom:12px">
        <div class="read-head">
          <div>
            <h3 class="read-title">${esc(d.name||d.id)} ${have? `<span class="pill">${T('libHave')}</span>`:''}</h3>
            ${meta? `<div class="read-src">${esc(meta)}</div>`:''}
          </div>
        </div>
        ${d.desc? `<p class="sub" style="margin:8px 0 12px">${esc(d.desc)}</p>`:''}
        <div class="flashbtns" style="justify-content:flex-start">${btn}</div>
      </div>`;
    }).join('');
    const err = libState.err? `<div class="hint" style="margin-bottom:12px">${TF('libErr',{e:esc(libState.err)})}</div>`:'';
    return head + err + rows;
  }

  async function libGet(i){
    const d = libState && libState.list && libState.list[i]; if(!d) return;
    libState.busy = d.id; libState.err = null; render();
    const url = libUrl(d);
    try{
      const res = await fetch(url, {cache:'no-cache'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      // 스키마 확인을 먼저 — 깨진 파일을 캐시에 넣어두면 다음 부팅마다 실패한다
      const pk = JSON.parse(text);
      registerLanguagePack(pk);
      if(!LANGUAGE_PACKS[pk.id]) throw new Error(T('libBad'));
      await (await caches.open(LIB_CACHE))
        .put(url, new Response(text, {headers:{'Content-Type':'application/json'}}));
      const map = libMap(); map[pk.id] = url; libSetMap(map);
      if(libState) libState.busy = null;
      applyI18n(); renderContentsMenu(); render();
    }catch(e){
      if(libState){ libState.busy = null; libState.err = e.message; }
      render();
    }
  }

  async function libDel(id){
    const map = libMap(), url = map[id];
    if(!url) return;
    const nm = (LANGUAGE_PACKS[id]||{}).name || id;
    if(!confirm(TF('libDelAsk',{n:nm}))) return;
    try{ (await caches.open(LIB_CACHE)).delete(url); }catch(e){}
    delete map[id]; libSetMap(map);
    delete LANGUAGE_PACKS[id];
    if(S.activeLang===id){          // 지금 읽던 책을 지웠으면 남은 팩으로 옮긴다
      const t = targetsForBase(curBase())[0];
      S.activeLang = t ? mainPackOf(t).id : Object.keys(LANGUAGE_PACKS)[0];
      S.activeLang = resolvePack(S.activeLang);
      save();
    }
    applyI18n(); renderContentsMenu(); render();
  }

  function libOpen(id){ switchLang(id); }
  function toggleLibrary(){ go(view.name==='library' ? 'home' : 'library'); }

  /* ── 테마 (시스템/라이트/다크 수동 전환) ────────── */
  const THEME_KEY = '3ls.theme';
  function currentTheme(){ return localStorage.getItem(THEME_KEY) || 'system'; }
  function applyTheme(mode){
    const root = document.documentElement;
    if(mode==='light'||mode==='dark') root.setAttribute('data-theme', mode);
    else root.removeAttribute('data-theme'); // system = 브라우저 설정 따름
    const el = document.getElementById('themeLabel');
    if(el) el.textContent = {system:T('thSystem'), light:T('thLight'), dark:T('thDark')}[mode] || T('thSystem');
    const isDark = mode==='dark' ||
      (mode==='system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    const mc = document.querySelector('meta[name="theme-color"]');
    if(mc) mc.setAttribute('content', isDark? '#1c2030' : '#ffffff');
  }
  function cycleTheme(){ // 시스템 → 라이트 → 다크 → 시스템
    const order = ['system','light','dark'];
    const next = order[(order.indexOf(currentTheme())+1) % order.length];
    localStorage.setItem(THEME_KEY, next); applyTheme(next);
  }

  /* ── 헤더 드롭다운 (⚙ 메뉴 · 📂 Contents) ───────── */
  function toggleMenu(e){
    if(e) e.stopPropagation();
    closeContents();
    const p = document.getElementById('menuPanel'), b = document.getElementById('menuBtn');
    const open = p.classList.toggle('open');
    if(b) b.setAttribute('aria-expanded', open? 'true':'false');
  }
  function closeMenu(){
    const p = document.getElementById('menuPanel'), b = document.getElementById('menuBtn');
    if(p) p.classList.remove('open');
    if(b) b.setAttribute('aria-expanded','false');
  }
  function toggleContents(e){
    if(e) e.stopPropagation();
    closeMenu();
    const p = document.getElementById('contentsPanel'), b = document.getElementById('contentsBtn');
    const open = p.classList.toggle('open');
    if(b) b.setAttribute('aria-expanded', open? 'true':'false');
  }
  function closeContents(){
    const p = document.getElementById('contentsPanel'), b = document.getElementById('contentsBtn');
    if(p) p.classList.remove('open');
    if(b) b.setAttribute('aria-expanded','false');
  }

  /* ── i18n 적용: 정적 UI 요소(헤더 버튼·메뉴)를 현재 base 언어로 ── */
  function setTx(id, txt){ const el=document.getElementById(id); if(el) el.textContent = txt; }
  function applyI18n(){
    setTx('txContents', ' '+T('contents')); setTx('txWord', ' '+T('word'));
    setTx('txSearch', ' '+T('search'));
    setTx('txRemind', ' '+T('remind')); setTx('txMenu', ' '+T('menu'));
    setTx('txMScreen', T('mScreen')); setTx('txMTheme', T('mTheme'));
    setTx('txMPacks', T('mPacks')); setTx('txMImport', T('mImport')); setTx('txMLibrary', T('mLibrary'));
    // 헤더 버튼 툴팁(title)도 base 언어로
    const tip=(id,k)=>{ const el=document.getElementById(id); if(el) el.title=T(k); };
    tip('contentsBtn','ttContents'); tip('menuBtn','ttMenu');
    document.querySelectorAll('.hbtn').forEach(b=>{
      const on=b.getAttribute('onclick')||'';
      if(on.includes('toggleWordbank')) b.title=T('ttWord');
      else if(on.includes('toggleSearch')) b.title=T('ttSearch');
      else if(on.includes("go('review')")) b.title=T('ttRemind');
    });
    applyTheme(currentTheme()); // 테마 라벨(시스템/라이트/다크)도 언어에 맞춰 갱신
  }

  /* ── 초기화 ─────────────────────────────────────── */
  function init(){
    const mv = $('#menuVersion'), fv = $('#footerVersion');
    if(mv) mv.textContent = '3Ls v' + APP_VERSION;
    if(fv) fv.textContent = 'v' + APP_VERSION;
    applyTheme(currentTheme());
    // 드롭다운 바깥 클릭 시 둘 다 닫기
    document.addEventListener('click', (e)=>{ if(!e.target.closest('.menu-wrap')){ closeMenu(); closeContents(); } });
    // 시스템 테마 변경 시(시스템 모드일 때만) 상태바 색 갱신
    if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', ()=>{
      if(currentTheme()==='system') applyTheme('system');
    });
    // localStorage에 저장된 커스텀 JSON 팩 복원
    try{
      const customs = JSON.parse(localStorage.getItem(PACKS_KEY)||'{}');
      Object.values(customs).forEach(registerLanguagePack);
    }catch(e){}
    // 활성 팩·base 정합성 맞추기 (저장값이 옛 id면 첫 팩으로)
    if(!S.base || !basesAvailable().includes(S.base)) S.base = basesAvailable()[0] || 'kr';
    // 활성 팩을 정하는 순서 — 둘 때 쓴다(서재 복원 전/후)
    function settleActive(){
      if(!S.activeLang || !LANGUAGE_PACKS[S.activeLang]){
        const t = targetsForBase(curBase())[0];
        S.activeLang = t ? mainPackOf(t).id : Object.keys(LANGUAGE_PACKS)[0];
      }
      S.activeLang = resolvePack(S.activeLang);  // 저장값이 빈 껍데기면 확장 사전으로
      // 활성 팩이 현재 base를 지원하지 않으면 지원하는 base로(kr 우선)
      const ap = LANGUAGE_PACKS[S.activeLang];
      if(ap && !packBases(ap).has(curBase())){ const bs=[...packBases(ap)]; if(bs.length) S.base = bs.includes('kr')?'kr':bs[0]; }
    }
    // 마지막으로 보던 게 서재에서 받은 원서라면 libRestore() 가 끝나야 등록된다.
    // 그 전에 폴백을 돌리면 id 를 뺏기고, 다음 save() 가 잘못된 id 를 굳혀 버린다.
    const pendingLib = !!(S.activeLang && !LANGUAGE_PACKS[S.activeLang] && (S.activeLang in libMap()));
    addEventListener('scroll', rdTrackScroll, {passive:true});   // 읽던 위치 기억
    if(!pendingLib){ settleActive(); applyI18n(); renderContentsMenu(); render(); }
    // 서재에서 받아둔 원서 복원 — 비동기라 첫 화면을 막지 않고, 끝나면 다시 그린다
    libRestore().then(ok=>{
      if(pendingLib) settleActive();      // 복원이 실패했으면 여기서 폴백
      if(ok || pendingLib){ applyI18n(); renderContentsMenu(); render(); }
    });
  }

  return {init, go, tab, speak, switchLang, setBase, importPack,
    flashFlip, flashMark, flashRestart,
    pickChoice, checkBlank, checkBlocks, checkCompose,
    paintBlocks, moveBlock, resetBlocks, insertChar, startQuiz,
    wbSetQuery, wbSetCat, wbSetMode, toggleWordbank, toggleCol,
    toggleSearch, gsSetQuery, gsGoTo,
    toggleRead, rdDoc, rdZoom, rdJump, rdSearch, rdLookup, rdToSearch, rdTapLine,
    toggleLibrary, libGet, libDel, libOpen,
    cycleTheme, toggleMenu, closeMenu, toggleContents, closeContents, togglePick};
